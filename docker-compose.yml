services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://opspilot:opspilot@postgres:5432/opspilot_db
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - opspilot

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=opspilot
      - POSTGRES_PASSWORD=opspilot
      - POSTGRES_DB=opspilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opspilot

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opspilot

volumes:
  postgres_data:
  redis_data:

networks:
  opspilot:
    driver: bridge
